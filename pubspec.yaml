name: head_first_ooad
description: "A Flutter app that presents structured, navigable chapter summaries for the book Head First Object-Oriented Analysis and Design."
publish_to: 'none'
version: 1.0.0+1
homepage: https://github.com/AhmedOmran22/head_first_ooad_app
repository: https://github.com/AhmedOmran22/head_first_ooad_app

environment:
  sdk: ^3.11.1
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.3.0
  get_it: ^9.2.1
  google_fonts: ^8.1.0
  lucide_icons: ^0.257.0
  equatable: ^2.1.0
  flutter_bloc: ^9.1.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/summaries/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"

